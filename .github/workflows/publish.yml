name: Publish ebooks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - name: Validate EPUB 3
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip \
            --output "$RUNNER_TEMP/epubcheck.zip"
          cd "$RUNNER_TEMP"
          echo '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  epubcheck.zip' | sha256sum --check
          unzip -q epubcheck.zip
          java -jar epubcheck-5.3.0/epubcheck.jar "$GITHUB_WORKSPACE/dist/tisquantums-day.epub" --failonwarnings
      - name: Stage editions in an enclosing folder
        run: |
          mkdir -p artifact-root/tisquantums-day-editions
          cp dist/tisquantums-day.{epub,pdf,cbz} artifact-root/tisquantums-day-editions/
      - uses: actions/upload-artifact@v4
        with:
          name: tisquantums-day-editions
          path: artifact-root/*/tisquantums-day.*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: ebook-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tisquantums-day-editions
          path: dist
      - name: Attach validated editions to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tisquantums-day-editions/* --clobber
          else
            gh release create "$TAG" dist/tisquantums-day-editions/* --verify-tag \
              --title "Tisquantum’s Day · $TAG" --notes "Fixed-layout EPUB, landscape PDF and CBZ editions."
          fi
